{% extends "templates/wiki/layout.html" %}

{% block html_lang %}zh-CN{% endblock %}

{% block title %}{{ page_title }} · 知识库{% endblock %}

{% block head %}
<link rel="alternate" type="application/rss+xml" title="博客 RSS" href="/api/method/wiki.api.blog.rss" />
<style>
	.brand-mark {
		display: inline-flex;
		height: 1.75rem;
		width: 1.75rem;
		align-items: center;
		justify-content: center;
		border-radius: 0.5rem;
		background: linear-gradient(135deg, #0c60d9 0%, #4a7aff 100%);
		color: #fff;
		font-size: 0.875rem;
		font-weight: 700;
		letter-spacing: -0.02em;
	}
</style>
{% endblock %}

{% block content %}
<main class="flex-1 min-w-0 px-4 py-10 lg:px-6 lg:py-14 xl:px-12">
	<div class="mx-auto flex w-full max-w-5xl flex-col gap-8">
		<header class="flex items-center justify-between gap-4 border-b border-outline-gray-2 pb-4">
			<a href="/wiki-app" class="flex items-center gap-2.5" aria-label="知识库">
				<span class="brand-mark" aria-hidden="true">K</span>
				<span class="text-[15px] font-semibold tracking-tight text-ink-gray-9">
					知识库
				</span>
				<span
					class="rounded bg-surface-blue-2 px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide text-ink-blue-9"
				>
					Blog
				</span>
			</a>
			<nav class="flex items-center gap-5 text-sm">
				<a class="text-ink-gray-6 hover:text-ink-gray-9" href="/wiki-app">文档</a>
				<a class="font-medium text-ink-gray-9" href="/blog">博客</a>
			</nav>
		</header>

		{% block blog_content %}{% endblock %}

		<footer class="border-t border-outline-gray-2 pt-4 text-sm text-ink-gray-5">
			© 知识库 · 产品更新、教程与实践
		</footer>
	</div>
</main>
{% endblock %}
